name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Gate 0 chained PRs target intermediate chain branches; review them with CI too.
      - 'fix/gate0-**'

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Build and Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore backend/CardSwitchPlatform.sln

      - name: Build
        run: dotnet build -c Release --no-restore backend/CardSwitchPlatform.sln

      # Integration tests (Category=Integration) need a PostgreSQL server and run in the
      # dedicated `integration-test` job below. Keeping the *.IntegrationTests projects in the
      # solution means they are still compiled here, so a broken integration build fails fast.
      - name: Test
        run: dotnet test -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=results.trx" backend/CardSwitchPlatform.sln

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  integration-test:
    name: Integration Test (CardVault + IsoSwitch on PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Consumed by each service's PostgresFixture (shared/tests/Postgres.TestSupport): an
      # administrative connection; the fixture creates one fresh database per test on this
      # server, with a per-service prefix (cv_it_, is_it_), so both projects share the service.
      # The password is the throwaway credential of the ephemeral Postgres service container above
      # (POSTGRES_PASSWORD); it never leaves this job and protects nothing. Allowed for gitleaks.
      CARDVAULT_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres" # gitleaks:allow
      ISOSWITCH_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres" # gitleaks:allow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: |
          dotnet restore backend/services/CardVault/tests/CardVault.IntegrationTests/CardVault.IntegrationTests.csproj
          dotnet restore backend/services/IsoSwitch/tests/IsoSwitch.IntegrationTests/IsoSwitch.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build -c Release --no-restore backend/services/CardVault/tests/CardVault.IntegrationTests/CardVault.IntegrationTests.csproj
          dotnet build -c Release --no-restore backend/services/IsoSwitch/tests/IsoSwitch.IntegrationTests/IsoSwitch.IntegrationTests.csproj

      - name: Test CardVault
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=integration-results.trx" backend/services/CardVault/tests/CardVault.IntegrationTests/CardVault.IntegrationTests.csproj

      - name: Test IsoSwitch
        if: always()
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=integration-results.trx" backend/services/IsoSwitch/tests/IsoSwitch.IntegrationTests/IsoSwitch.IntegrationTests.csproj

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            backend/services/CardVault/tests/CardVault.IntegrationTests/TestResults/*.trx
            backend/services/IsoSwitch/tests/IsoSwitch.IntegrationTests/TestResults/*.trx

  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build production bundle
        run: npm run build --prefix frontend

  docker-build:
    name: Docker Build (backend services)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CardVault image
        run: docker build -f backend/services/CardVault/src/CardVault.Api/Dockerfile backend/

      - name: Build IsoSwitch image
        run: docker build -f backend/services/IsoSwitch/src/IsoSwitch.Api/Dockerfile backend/

      - name: Build IsoAudit image
        run: docker build -f backend/services/IsoAudit/src/IsoAudit.Api/Dockerfile backend/
