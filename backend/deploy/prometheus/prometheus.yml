global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'isoswitch'
    static_configs:
      - targets: ['isoswitch:5201']
  - job_name: 'cardvault'
    static_configs:
      - targets: ['cardvault:5101']
  - job_name: 'isoaudit'
    static_configs:
      - targets: ['isoaudit:5301']
